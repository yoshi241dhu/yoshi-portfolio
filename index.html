          <h3>音楽の歴史で学ぶ！生成AIの仕組み</h3>
          <p class="meta">2026</p>
          <p>生成AIの「膨大な過去データ（音楽の歴史）をもとに、文脈に沿った次の展開（音符）の確率を計算して出力している」という仕組みを、高校生へ直感的に伝えることを意識しました。
難解な数式やニューラルネットワークの理論をそのまま見せるのではなく、親しみやすいアニメ調のイラストと「古典音楽からデジタル音楽へ至る楽曲の流れ」「確率で選ばれる音符」「生成された曲を聴いて楽しむ姿」という構成を採用しています。AIをブラックボックスではなく「歴史を学んで新しいアイデアを提案する身近なパートナー」として捉え、探究心や創作意欲をかき立てることを意図しています。</p>

          <h3>オープンモデルと商用モデル</h3>
          <p class="meta">2026</p>
          <p>このプロンプトは、AIモデルの複雑な性質を、直感的に理解できる「空間」に落とし込むことで、一目で違いが伝わるように設計しました。
左側の「オープンモデル」は、壁のない工房です。機械の中身が見え、誰でも改造できる「自由さ」と「共同研究」を表現しています。同時に、その自由さが「ユーザーリスク（泥池）」と隣り合わせであることも示し、利点と注意点の双方を伝えています。
右側の「商用モデル」は、閉ざされたスタジオです。中身は見えない（ブラックボックス）代わりに、警備やフィルターで守られた「安定性」「安全性」を表現しています。企業利用における「信頼」と、洗練された「完成品」を受け取る場所であることを強調しています。</p>
          <details>
            <summary>使ったプロンプト</summary>
            <pre>「オープンモデルと商用モデルの違い」が一目で分かる1枚を作ってください。中央に境界線が引かれた、すっきりとした単一パネル構成の、鮮やかなイラストです。このイラストは、メタファーを用いて「オープンモデル」と「商用モデル」を対比させてください。左側、オープンモデル：活気あふれる共有型の「研究所兼ワークショップ」が描かれています。カジュアルな服装の人々が行き交う空間、彼らは協力しながら、「モデルコード」と記された、歯車や論理回路がむき出しのマシンを改造しています。人々はシンプルな道具を使い、独自の拡張パーツを製作したり実験を行ったりしています。手前には「自由なワークフロー」と書かれた看板があります。川が「ユーザーリスク」と記された、泥にまみれ草木が茂る池に流れ込んでおり、実験的な環境や安全策の欠如が強調されています。全体的な色調は、青、緑、そして温かみのあるアースカラーで構成されています。右側、商用モデル：洗練されたモダンな「企業本社兼スタジオ」が描かれています。清潔感があり、建物とプロフェッショナルな雰囲気のビジネススタッフが特徴です。警備チームが、「クローズド・ブラックボックス」と記された巨大で完全に密閉された黒い立方体を囲んでおり、そこには発光するセキュリティアイコンや「安全フィルター＆権利処理済み」のシンボルが表示されています。上部には「安定性・品質・信頼性」というバナーが掲げられています。「安全なAPIアクセスとサービス」と記されたゲート（ターンテーブル）によってアクセスが制限されています。手前の通路は滑らかに整備・管理されています。ガラス越しには劇場のようなステージが見え、そこには「プレミアムな成果物／管理された環境」という文字と共に、洗練された完成品が展示されています。全体的な色調は、シルバー、鮮やかな青、で構成されています。イラストは、明瞭さを意識してください</pre>

      <figure class="work">

        <figcaption>
          <h3>拡散モデルのオーケストラ</h3>
          <p class="meta">2026</p>
          <p>複雑なAI技術である「拡散モデル（Diffusion Model）」を、音楽のオーケストラ演奏に例えて、直感的に理解してもらうことを目的としています。
画像生成AIの「学習」と「生成」のプロセスを、オーケストラの演奏がバラバラな音（ノイズ）へと解体され、そしてそのノイズから再び一つの美しい楽曲へと再構築される流れに見立てて表現しました。
さらに、生成時の重要な設定である「ステップ数」と「サンプラー」の違いによって、楽曲（生成される画像）がどのように変化するかを視覚化し、その仕組みを分かりやすく伝えています。</p>
          <details>
            <summary>使ったプロンプト</summary>
            <pre>拡散モデルの仕組みをオーケストラになぞらえて解説する、インフォグラフィック風のイラスト。
上部に「学習：データにノイズを足す過程」を配置し、鮮明なオーケストラ演奏の画像が段階的にノイズに変わっていく様子を描写。各パネル上部に「少しずつノイズを足す」のテキスト、右端に「オーケストラのバラバラな音（完全なノイズ）」を配置。
下部に「生成：ノイズを逆にたどる」を配置し、右端のノイズから段階的にオーケストラと楽譜が復元されていく様子を描写。左端に「美しいオーケストラ演奏」と「一つの曲（完成した音楽）」を配置。
中央に大きな文字で「オーケストラのバラバラな音（ノイズ）が一つの曲（データ）になること」、その下に「学習した過程を逆にたどり、ノイズから音楽（データ）を復元」という解説テキスト。
下部左に「ステップ数（何回に分けて復元するか）」を配置し、「ステップ数：少（速いが粗い）」と「ステップ数：多（遅いが丁寧）」による結果の比較を描写。
下部右に「サンプラー（復元の進め方の流儀）」を配置し、2人の指揮者アイコンを起点に「サンプラーA（流儀：流れるような）」と「サンプラーB（流儀：正確な）」によるタッチの異なる結果の比較を描写。
全体をクリーム色の背景で、手書き風のビジュアルと日本語テキストで構成。</pre>
          </details>
        </figcaption>

単なる自動応答ではなく「視覚認識・生成・人間による評価ループ」で成り立つシステム全体を1枚の図解で表現しました</p>

左側には、メッセージアプリを表示したスマートフォンの画面が描かれています。そこには、「全力肯定彼氏（LuC4）」という、擬人化されたオオカミの愛らしく親しみやすいキャラクターがアバターとして登場しています。チャット画面には、男性ユーザーに向けて「ずっと応援してるよ！」「よく頑張ったね！すごい！」といった、励ましの言葉が書かれた日本語の吹き出しが表示されています。
右側には、青い透明なボックス状の図の中に、バックエンドの処理プロセスが描かれています。ここでは、「マルチモーダルAIシステム」がユーザーの入力からテキスト分析やコンピュータビジョンによる画像認識を行っている様子が示されています。さらに、このシステムは「Human-in-the-Loop（HITL）」のワークステーションへと接続されており、そこでは人間のオペレーターがデスクでコンピュータに向かい、AIの応答を評価してフィードバックを行う様子が描かれています。</pre>
